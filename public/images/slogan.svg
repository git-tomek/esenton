<svg
  width="900"
  height="430"
  viewBox="0 0 900 430"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <linearGradient
      id="growthGradient"
      x1="300"
      y1="260"
      x2="650"
      y2="390"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0" stop-color="#147DFF" />
      <stop offset="0.55" stop-color="#0AA8FF" />
      <stop offset="1" stop-color="#15D9FF" />
    </linearGradient>

    <filter
      id="softGlow"
      x="-20%"
      y="-20%"
      width="140%"
      height="140%"
    >
      <feGaussianBlur stdDeviation="3" result="blur" />

      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Transparent background -->

  <g transform="rotate(-4 450 210)">
    <!-- Pomysł -->
    <text
      x="210"
      y="130"
      fill="#FFFFFF"
      font-size="82"
      font-weight="600"
      letter-spacing="-2"
      font-family="Apple Chancery, Brush Script MT, Segoe Script, cursive"
    >
      Pomysł.
    </text>

    <!-- Technologia -->
    <text
      x="250"
      y="225"
      fill="#FFFFFF"
      font-size="78"
      font-weight="600"
      letter-spacing="-2"
      font-family="Apple Chancery, Brush Script MT, Segoe Script, cursive"
    >
      Technologia.
    </text>

    <!-- Rozwój -->
    <text
      x="260"
      y="325"
      fill="url(#growthGradient)"
      font-size="96"
      font-weight="700"
      letter-spacing="-3"
      font-family="Apple Chancery, Brush Script MT, Segoe Script, cursive"
      filter="url(#softGlow)"
    >
      Rozwój.
    </text>

    <!-- Podkreślenie przechodzące w strzałkę -->
    <path
      d="
        M230 350
        C320 365, 430 360, 535 346
        C610 336, 665 320, 716 282
      "
      stroke="url(#growthGradient)"
      stroke-width="10"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Grot strzałki -->
    <path
      d="M683 292 L724 277 L711 317"
      stroke="url(#growthGradient)"
      stroke-width="10"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>